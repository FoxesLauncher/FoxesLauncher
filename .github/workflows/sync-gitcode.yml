name: Sync to GitCode

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  sync:
    if: ${{ vars.FXL_GITCODE_SYNC == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push branch to GitCode
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: ${{ vars.FXL_GITCODE_REPO }}
        run: |
          set -euo pipefail
          auth="$(printf 'oauth2:%s' "$GITCODE_TOKEN" | base64 -w0)"
          # 强制推送，保证 GitHub 改写历史后 GitCode 能同步到相同提交
          git -c "http.extraHeader=Authorization: Basic $auth" \
            push --force "https://gitcode.com/$GITCODE_REPO.git" \
            "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Push tag to GitCode
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: ${{ vars.FXL_GITCODE_REPO }}
        run: |
          set -euo pipefail
          auth="$(printf 'oauth2:%s' "$GITCODE_TOKEN" | base64 -w0)"
          git -c "http.extraHeader=Authorization: Basic $auth" \
            push --force "https://gitcode.com/$GITCODE_REPO.git" \
            "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
