name: Build
on:
  push:
    paths:
      - 'Foxes Launcher/**'
      - '.github/workflows/**'
      - 'build/**'
      - '.env.example'
  pull_request:
    paths:
      - 'Foxes Launcher/**'
      - '.github/workflows/**'
      - 'build/**'
      - '.env.example'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Foxes Launcher\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Restore NuGet Packages
      run: dotnet restore FXLCS\FXLCS.csproj

    - name: Self-test i18n checker
      run: python build\i18n_check.py --self-test

    - name: Validate i18n
      run: python build\i18n_check.py

    - name: Check i18n fragment baseline
      run: python build\i18n_check.py --report-fragments --max-fragments 27

    - name: Build
      env:
        FXL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        FXL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        FXL_COMMIT_HASH: ${{ github.sha }}
      run: msbuild "Foxes Launcher\Foxes Launcher.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: Foxes Launcher\obj\${{ matrix.configuration }}\Foxes Launcher.exe
